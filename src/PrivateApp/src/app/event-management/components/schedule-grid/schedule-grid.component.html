<div class="schedule-grid-container">
  <div class="header">
    <h2>Schedule</h2>
    <button mat-raised-button color="primary" (click)="addTimeSlot()" aria-label="Add new time slot">
      <mat-icon>add</mat-icon> Add Time Slot
    </button>
  </div>

  <div class="grid-wrapper">
    <table class="schedule-table">
      <thead>
        <tr>
          <th class="time-col">Time</th>
          <th *ngFor="let track of tracks">{{ track.name }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let slot of timeSlots">
          <td class="time-col">
            <div class="time-range">{{ slot.startTime | date:'shortTime' }} - {{ slot.endTime | date:'shortTime' }}</div>
            <div class="slot-name">{{ slot.name }}</div>
            <div class="slot-actions">
                <button mat-icon-button (click)="editTimeSlot(slot)" [attr.aria-label]="'Edit time slot ' + slot.name">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteTimeSlot(slot)" [attr.aria-label]="'Delete time slot ' + slot.name">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
          </td>
          <td *ngFor="let track of tracks"
              cdkDropList
              [cdkDropListData]="gridData[slot.id][track.id]"
              (cdkDropListDropped)="drop($event, track.id, slot.id)"
              class="session-cell">

            <app-session-card
              *ngFor="let session of gridData[slot.id][track.id]"
              cdkDrag
              [cdkDragData]="session"
              [session]="session">
            </app-session-card>

          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="timeSlots.length === 0" class="no-slots">
      No time slots defined.
    </div>
  </div>
</div>
