<div class="session-sidebar">
  <h3>Unassigned Sessions</h3>
  <div
    cdkDropList
    [cdkDropListData]="unassignedSessions"
    class="session-list"
    id="unassigned-sessions-list"
    [cdkDropListConnectedTo]="['schedule-grid']">

    @for (session of unassignedSessions; track session) {
      <div class="session-card" cdkDrag [cdkDragData]="session">
        <div class="session-title">{{ session.title }}</div>
        <div class="session-meta">
          <span class="duration">{{ session.duration }} min</span>
          <span class="level">{{ session.level }}</span>
        </div>
        <ng-template cdkDragPreview>
          <div class="session-preview">
            {{ session.title }}
          </div>
        </ng-template>
      </div>
    }

    @if (unassignedSessions.length === 0) {
      <div class="no-sessions">
        No unassigned sessions.
      </div>
    }
  </div>
</div>
