name: Build and Deploy

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  AZURE_RESOURCE_GROUP: 'eventmanagement-rg'

jobs:
  build-api:
    name: Build .NET APIs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Publish PublicApi
        run: dotnet publish src/PublicApi/PublicApi.csproj --configuration Release --output ./publish/publicapi --no-build

      - name: Publish PrivateApi
        run: dotnet publish src/PrivateApi/PrivateApi.csproj --configuration Release --output ./publish/privateapi --no-build

      - name: Upload PublicApi artifact
        uses: actions/upload-artifact@v4
        with:
          name: publicapi
          path: ./publish/publicapi

      - name: Upload PrivateApi artifact
        uses: actions/upload-artifact@v4
        with:
          name: privateapi
          path: ./publish/privateapi

  build-angular:
    name: Build Angular Apps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install PublicApp dependencies
        working-directory: src/PublicApp
        run: npm ci

      - name: Lint PublicApp
        working-directory: src/PublicApp
        run: npm run lint || true

      - name: Test PublicApp
        working-directory: src/PublicApp
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage || true

      - name: Build PublicApp
        working-directory: src/PublicApp
        run: npm run build -- --configuration=production

      - name: Install PrivateApp dependencies
        working-directory: src/PrivateApp
        run: npm ci

      - name: Lint PrivateApp
        working-directory: src/PrivateApp
        run: npm run lint || true

      - name: Test PrivateApp
        working-directory: src/PrivateApp
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage || true

      - name: Build PrivateApp
        working-directory: src/PrivateApp
        run: npm run build -- --configuration=production

      - name: Upload PublicApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: publicapp
          path: src/PublicApp/dist/public-app/browser

      - name: Upload PrivateApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: privateapp
          path: src/PrivateApp/dist/private-app/browser

  docker-build:
    name: Build and Push Docker Images
    needs: [build-api, build-angular]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download PublicApi artifact
        uses: actions/download-artifact@v4
        with:
          name: publicapi
          path: ./publish/publicapi

      - name: Download PrivateApi artifact
        uses: actions/download-artifact@v4
        with:
          name: privateapi
          path: ./publish/privateapi

      - name: Download PublicApp artifact
        uses: actions/download-artifact@v4
        with:
          name: publicapp
          path: ./publish/publicapp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push PublicApi
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/PublicApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapi:${{ steps.image-tag.outputs.tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PrivateApi
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/PrivateApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/privateapi:${{ steps.image-tag.outputs.tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/privateapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PublicApp
        uses: docker/build-push-action@v5
        with:
          context: ./src/PublicApp
          file: ./src/PublicApp/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapp:${{ steps.image-tag.outputs.tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment:
      name: development
      url: ${{ steps.deploy.outputs.app-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}-dev
          template: ./deployment/main.bicep
          parameters: ./deployment/parameters.dev.json imageTag=${{ github.sha }}
          failOnStdErr: false

      - name: Update Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name eventmgmt-dev-publicapi \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}-dev \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapi:${{ github.sha }}
            
            az containerapp update \
              --name eventmgmt-dev-privateapi \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}-dev \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/privateapi:${{ github.sha }}
            
            az containerapp update \
              --name eventmgmt-dev-web \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}-dev \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapp:${{ github.sha }}

  deploy-prod:
    name: Deploy to Production
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}-prod
          template: ./deployment/main.bicep
          parameters: ./deployment/parameters.prod.json imageTag=${{ github.sha }}
          failOnStdErr: false

      - name: Update Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name eventmgmt-prod-publicapi \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}-prod \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapi:${{ github.sha }}
            
            az containerapp update \
              --name eventmgmt-prod-privateapi \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}-prod \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/privateapi:${{ github.sha }}
            
            az containerapp update \
              --name eventmgmt-prod-web \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}-prod \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/eventmanagement/publicapp:${{ github.sha }}
