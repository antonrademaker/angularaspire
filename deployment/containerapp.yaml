apiVersion: 2023-05-01
location: eastus
name: eventmanagement-web
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${ENVIRONMENT_NAME}
  
  configuration:
    registries:
      - server: ${ACR_LOGIN_SERVER}
        username: ${ACR_USERNAME}
        passwordSecretRef: acr-password
    
    ingress:
      external: true
      targetPort: 80
      transport: http
      customDomains:
        - name: ${APP_DOMAIN}
          bindingType: SniEnabled
          certificateId: /subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${ENVIRONMENT_NAME}/certificates/${CERTIFICATE_NAME}
  
  template:
    containers:
      - name: publicapp
        image: ${ACR_LOGIN_SERVER}/eventmanagement/publicapp:${IMAGE_TAG}
        resources:
          cpu: 0.25
          memory: 0.5Gi
        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          - type: Readiness
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
    
    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "200"
