name: PR Validation

on:
  pull_request:
    branches:
      - main
      - 'release/*'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  validate-api:
    name: Validate .NET APIs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  validate-angular:
    name: Validate Angular Apps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install PublicApp dependencies
        working-directory: src/PublicApp
        run: npm ci

      - name: Lint PublicApp
        working-directory: src/PublicApp
        run: npm run lint

      - name: Test PublicApp
        working-directory: src/PublicApp
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build PublicApp
        working-directory: src/PublicApp
        run: npm run build -- --configuration=production

      - name: Install PrivateApp dependencies
        working-directory: src/PrivateApp
        run: npm ci

      - name: Lint PrivateApp
        working-directory: src/PrivateApp
        run: npm run lint

      - name: Test PrivateApp
        working-directory: src/PrivateApp
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build PrivateApp
        working-directory: src/PrivateApp
        run: npm run build -- --configuration=production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run security scan
        run: |
          dotnet tool install --global dotnet-outdated-tool
          dotnet outdated --fail-on-updates || true

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive || true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
        continue-on-error: true
